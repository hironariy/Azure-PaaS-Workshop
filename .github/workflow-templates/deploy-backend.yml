name: Deploy Backend to Azure App Service

on:
  push:
    branches:
      - main
    paths:
      - 'materials/backend/**'
      - 'scripts/workshop-deploy-common.sh'
      - 'scripts/check-public-lock.cjs'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend-${{ github.repository }}
  cancel-in-progress: false

env:
  BACKEND_DIR: materials/backend
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}

jobs:
  build:
    name: Build the credential-free production ZIP
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: '${{ env.BACKEND_DIR }}/package-lock.json'

      - name: Validate production branch, OIDC IDs and deployment target
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "Production deployment requires the main branch." >&2
            exit 1
          fi
          node <<'NODE'
          const guid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
          for (const key of ['AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID']) {
            if (!guid.test(process.env[key] || '')) throw new Error(`Missing or invalid variable: ${key}`);
          }
          const group = process.env.AZURE_RESOURCE_GROUP || '';
          if (!/^[a-z0-9_().-]{1,90}$/i.test(group) || group.endsWith('.')) throw new Error('Invalid AZURE_RESOURCE_GROUP');
          if (!/^[a-z0-9][a-z0-9-]{0,58}[a-z0-9]$/i.test(process.env.AZURE_WEBAPP_NAME || '')) throw new Error('Invalid AZURE_WEBAPP_NAME');
          NODE

      - name: Verify public sources and install build dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          node ../../scripts/check-public-lock.cjs package-lock.json
          NODE_ENV=production npm ci --include=dev --no-fund --registry=https://registry.npmjs.org

      - name: Check application quality before packaging
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          npm run type-check
          npm run lint
          npm test
          npm audit --audit-level=low --registry=https://registry.npmjs.org
          npm audit --package-lock-only --audit-level=low --registry=https://registry.npmjs.org

      - name: Build and package the isolated production ZIP
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          PACKAGE="$RUNNER_TEMP/backend-production"
          mkdir "$PACKAGE"
          npm run build -- --outDir "$PACKAGE/dist"
          cp package.json package-lock.json "$PACKAGE/"
          cd "$PACKAGE"
          npm ci --omit=dev --no-fund --registry=https://registry.npmjs.org
          test -f dist/src/app.js
          test ! -d node_modules/typescript
          npm audit --omit=dev --audit-level=low --registry=https://registry.npmjs.org
          zip -qr "$RUNNER_TEMP/backend-production.zip" .
          unzip -tq "$RUNNER_TEMP/backend-production.zip"

      - name: Preserve only the production ZIP for the deployment job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-production
          path: ${{ runner.temp }}/backend-production.zip
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy the verified ZIP with OIDC
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the same source revision without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use Node.js 24 for the shared health checker
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Restore the verified ZIP from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-production
          path: ${{ runner.temp }}/backend-download
      - name: Validate the restored artifact and record the source revision
        run: |
          unzip -tq "$RUNNER_TEMP/backend-download/backend-production.zip"
          unzip -Z1 "$RUNNER_TEMP/backend-download/backend-production.zip" | grep -x 'dist/src/app.js' >/dev/null
          echo "Deployment revision: $GITHUB_SHA"
      - name: Azure login (OIDC)
        uses: Azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify actual Azure context and hostname
        run: |
          ACCOUNT="$(az account show --subscription "$AZURE_SUBSCRIPTION_ID" --output json)"
          printf '%s' "$ACCOUNT" | node -e '
            let data = ""; process.stdin.on("data", chunk => data += chunk);
            process.stdin.on("end", () => {
              const a = JSON.parse(data);
              if (a.state !== "Enabled" || a.environmentName !== "AzureCloud" ||
                  a.id.toLowerCase() !== process.env.AZURE_SUBSCRIPTION_ID.toLowerCase() ||
                  a.tenantId.toLowerCase() !== process.env.AZURE_TENANT_ID.toLowerCase()) {
                throw new Error("Azure subscription/tenant context mismatch");
              }
            });'
          HOSTNAME="$(az webapp show --subscription "$AZURE_SUBSCRIPTION_ID" \
            --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" \
            --query defaultHostName --output tsv)"
          if ! [[ "$HOSTNAME" =~ ^[a-z0-9.-]+\.azurewebsites\.net$ ]]; then
            echo "App Service returned an invalid hostname." >&2
            exit 1
          fi
          printf 'APP_HOSTNAME=%s\n' "$HOSTNAME" >> "$GITHUB_ENV"

      - name: Configure App Service
        run: |
          az webapp config appsettings set --subscription "$AZURE_SUBSCRIPTION_ID" \
            --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" \
            --settings "SCM_DO_BUILD_DURING_DEPLOYMENT=false" \
            --output none

          az webapp config set --subscription "$AZURE_SUBSCRIPTION_ID" \
            --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" \
            --startup-file "node dist/src/app.js" --output none

      - name: Deploy to App Service
        run: |
          DEPLOY_HELP="$(az webapp deploy --help)"
          set --
          if [[ "$DEPLOY_HELP" == *"--track-status"* ]]; then set -- --track-status false; fi
          az webapp deploy --subscription "$AZURE_SUBSCRIPTION_ID" \
            --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" \
            --src-path "$RUNNER_TEMP/backend-download/backend-production.zip" --type zip --clean true \
            --restart true --async true "$@" --output none

      - name: Require bounded healthy JSON from the actual hostname
        run: |
          sleep 20
          source scripts/workshop-deploy-common.sh
          workshop_wait_for_health "https://$APP_HOSTNAME/health"
          echo "Upload/readiness passed; separately verify this release, browser CRUD and telemetry."
