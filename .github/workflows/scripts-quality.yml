name: Workshop script quality

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'materials/bicep/**'
      - 'materials/docs/learner/**'
      - '.github/workflows/scripts-quality.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'materials/bicep/**'
      - 'materials/docs/learner/**'
      - '.github/workflows/scripts-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scripts-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Check native script syntax and ZIP tools
        shell: bash
        run: |
          command -v zip
          command -v unzip
          for script in scripts/*.sh; do bash -n "$script"; done
          for script in scripts/*.cjs scripts/test/*.cjs; do node --check "$script"; done
      - name: Run isolated native regression tests
        run: node --test scripts/test/*.test.cjs
