name: Workshop quality

on:
  pull_request:
    paths:
      - ".github/workflows/quality.yml"
      - "materials/backend/**"
      - "materials/frontend/**"
      - "materials/bicep/**"
      - "scripts/deploy-backend.sh"
      - "scripts/deploy-frontend.sh"
  push:
    branches: [main]
    paths:
      - ".github/workflows/quality.yml"
      - "materials/backend/**"
      - "materials/frontend/**"
      - "materials/bicep/**"
      - "scripts/deploy-backend.sh"
      - "scripts/deploy-frontend.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application (${{ matrix.application }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        application: [backend, frontend]
    defaults:
      run:
        working-directory: materials/${{ matrix.application }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: materials/${{ matrix.application }}/package-lock.json
      - name: Require portable public npm package sources
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const invalid = Object.entries(lock.packages).filter(([name, pkg]) => {
            if (!name || !pkg.resolved) return false;
            const url = typeof pkg.resolved === 'string' ? URL.parse(pkg.resolved) : null;
            return !url || url.origin !== 'https://registry.npmjs.org' || url.username || url.password;
          });
          if (invalid.length) {
            throw new Error(`Non-public package sources: ${invalid.slice(0, 3).map(([name]) => name).join(', ')}. Regenerate from a supported public registry before merging.`);
          }
          NODE
      - name: Restore locked build dependencies
        run: npm ci --include=dev --no-fund
      - name: Type-check application and tests
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Run regression tests
        run: npm test
      - name: Build production artifact
        run: npm run build
      - name: Audit installed, production, and lockfile scopes
        run: |
          npm audit --audit-level=low
          npm audit --omit=dev --audit-level=low
          npm audit --package-lock-only --audit-level=low

  bicep:
    name: Bicep artifact parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Compile with the distributed artifact's Bicep version
        run: |
          az bicep install --version v0.44.1
          az bicep build --file materials/bicep/main.bicep --outfile "$RUNNER_TEMP/main.json"
      - name: Require the distributed ARM template to match source
        run: diff -u materials/bicep/main.json "$RUNNER_TEMP/main.json"
